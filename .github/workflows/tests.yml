name: Test on various platforms CI

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Homebrew cache dir
        run: mkdir -p .cache/homebrew

      - name: Cache Homebrew downloads
        uses: actions/cache@v5
        with:
          path: .cache/homebrew
          key: ${{ runner.os }}-homebrew-${{ runner.arch }}-dwm2-v1
          restore-keys: |
            ${{ runner.os }}-homebrew-${{ runner.arch }}-dwm2-

      - name: Install build deps
        env:
          HOMEBREW_CACHE: ${{ github.workspace }}/.cache/homebrew
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew --cache
          brew install \
            fontconfig \
            freetype \
            harfbuzz \
            imlib2 \
            libx11 \
            libxft \
            libxinerama \
            libxrender \
            pkgconf \
            xorg-server
          cc --version
          pkg-config --version
          build_deps="fontconfig freetype2 harfbuzz imlib2 x11 xft xinerama xrender"
          pkg-config --libs $build_deps
          export CPPFLAGS="${CPPFLAGS:-} $(pkg-config --cflags $build_deps)"
          export LDFLAGS="${LDFLAGS:-} $(pkg-config --libs $build_deps)"

      - name: Build and Test
        run: |
          export DISPLAY=:99
          Xvfb "$DISPLAY" -screen 0 1024x768x24 &
          xvfb_pid=$!
          trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 1
          build_deps="fontconfig freetype2 harfbuzz imlib2 x11 xft xinerama xrender"
          export CPPFLAGS="${CPPFLAGS:-} $(pkg-config --cflags $build_deps)"
          export LDFLAGS="${LDFLAGS:-} $(pkg-config --libs $build_deps)"
          ./build.sh build
          ./build.sh test

  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libfontconfig-dev \
            libfreetype-dev \
            libharfbuzz-dev \
            libimlib2-dev \
            libx11-dev \
            libxft-dev \
            libxinerama-dev \
            libxrender-dev \
            pkg-config \
            xvfb
          cc --version
          pkg-config --version
          build_deps="fontconfig freetype2 harfbuzz imlib2 x11 xft xinerama xrender"
          pkg-config --libs $build_deps

      - name: Build and Test
        run: |
          build_deps="fontconfig freetype2 harfbuzz imlib2 x11 xft xinerama xrender"
          export CPPFLAGS="${CPPFLAGS:-} $(pkg-config --cflags $build_deps)"
          export LDFLAGS="${LDFLAGS:-} $(pkg-config --libs $build_deps)"
          xvfb-run -a sh -c './build.sh build && ./build.sh test'

  freebsd:
    runs-on: ubuntu-24.04
    name: FreeBSD VM
    steps:
      - uses: actions/checkout@v4

      - name: Build and Test
        uses: vmactions/freebsd-vm@v1
        with:
          usesh: true
          run: |
            pkg install -y \
              bash \
              fontconfig \
              freetype2 \
              gcc \
              harfbuzz \
              imlib2 \
              libX11 \
              libXft \
              libXinerama \
              libXrender \
              pkgconf \
              xorg-vfbserver
            export DISPLAY=:99
            Xvfb "$DISPLAY" -screen 0 1024x768x24 &
            xvfb_pid=$!
            trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
            sleep 1
            cc --version
            pkg-config --version
            build_deps="fontconfig freetype2 harfbuzz imlib2 x11 xft xinerama xrender"
            pkg-config --libs $build_deps
            export CPPFLAGS="${CPPFLAGS:-} $(pkg-config --cflags $build_deps)"
            export LDFLAGS="${LDFLAGS:-} $(pkg-config --libs $build_deps)"
            ./build.sh build
            ./build.sh test

  openbsd:
    runs-on: ubuntu-24.04
    name: OpenBSD VM
    steps:
      - uses: actions/checkout@v4

      - name: Build and Test
        uses: vmactions/openbsd-vm@v1
        with:
          usesh: true
          run: |
            pkg_add \
              harfbuzz \
              imlib2
            export PKG_CONFIG_PATH=/usr/X11R6/lib/pkgconfig:/usr/local/lib/pkgconfig
            export DISPLAY=:99
            Xvfb "$DISPLAY" -screen 0 1024x768x24 &
            xvfb_pid=$!
            trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
            sleep 1
            cc --version
            pkg-config --version
            build_deps="fontconfig freetype2 harfbuzz imlib2 x11 xft xinerama xrender"
            pkg-config --libs $build_deps
            export CPPFLAGS="${CPPFLAGS:-} $(pkg-config --cflags $build_deps)"
            export LDFLAGS="${LDFLAGS:-} $(pkg-config --libs $build_deps)"
            ./build.sh build
            ./build.sh test

  netbsd:
    runs-on: ubuntu-24.04
    name: NetBSD VM
    steps:
      - uses: actions/checkout@v4

      - name: Cache NetBSD X sets
        uses: actions/cache@v5
        with:
          path: .cache/netbsd-xsets
          key: netbsd-xsets-v1
          restore-keys: |
            netbsd-xsets-

      - name: Build and Test
        uses: vmactions/netbsd-vm@v1
        with:
          usesh: true
          run: |
            netbsd_release=$(uname -r)
            netbsd_release=${netbsd_release%%_*}
            netbsd_machine=$(uname -m)
            case "$netbsd_machine" in
            x86_64)
              netbsd_machine=amd64
              ;;
            esac

            netbsd_sets_url="https://cdn.netbsd.org/pub/NetBSD"
            netbsd_sets_url="$netbsd_sets_url/NetBSD-$netbsd_release"
            netbsd_sets_url="$netbsd_sets_url/$netbsd_machine/binary/sets"

            netbsd_xsets_cache="${GITHUB_WORKSPACE:-$PWD}/.cache/netbsd-xsets"
            netbsd_xsets_cache="$netbsd_xsets_cache/$netbsd_release/$netbsd_machine"
            mkdir -p "$netbsd_xsets_cache"

            if [ ! -x /usr/X11R7/bin/Xvfb ]; then
              for netbsd_xset in xbase xcomp xetc xfont xserver; do
                netbsd_xset_file="$netbsd_xsets_cache/$netbsd_xset.tar.xz"
                if [ ! -f "$netbsd_xset_file" ]; then
                  ftp -V -o "$netbsd_xset_file" \
                    "$netbsd_sets_url/$netbsd_xset.tar.xz"
                fi
                tar -C / -xpf "$netbsd_xset_file"
              done
            fi

            export PATH="/usr/X11R7/bin:$PATH"
            export LD_LIBRARY_PATH="/usr/pkg/lib:/usr/X11R7/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"

            PKG_CONFIG_PATH=/usr/X11R7/lib/pkgconfig
            PKG_CONFIG_PATH="$PKG_CONFIG_PATH:/usr/pkg/lib/pkgconfig"
            export PKG_CONFIG_PATH

            LDFLAGS="${LDFLAGS:-}"
            LDFLAGS="$LDFLAGS -Wl,-rpath,/usr/pkg/lib"
            LDFLAGS="$LDFLAGS -Wl,-rpath,/usr/X11R7/lib"
            export LDFLAGS

            if ! command -v pkgin >/dev/null 2>&1; then
              pkg_add pkgin
            fi
            pkgin -y install \
              harfbuzz \
              imlib2 \
              pkgconf

            export DISPLAY=:99
            Xvfb "$DISPLAY" -screen 0 1024x768x24 &
            xvfb_pid=$!
            trap 'kill "$xvfb_pid" 2>/dev/null || true' EXIT
            sleep 1
            cc --version
            pkg-config --version
            build_deps="fontconfig freetype2 harfbuzz imlib2 x11 xft xinerama xrender"
            pkg-config --libs $build_deps
            export CPPFLAGS="${CPPFLAGS:-} $(pkg-config --cflags $build_deps)"
            export LDFLAGS="${LDFLAGS:-} $(pkg-config --libs $build_deps)"
            ./build.sh build
            ./build.sh test
